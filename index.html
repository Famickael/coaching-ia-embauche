<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="La Répét' : entraînement autonome à l'entretien d'embauche, avec un retour qui décrit sans noter et un coach qui garde la main." />
    <meta name="theme-color" content="#F8FAFC" />
    <title>La Répét' · S'entraîner à l'entretien d'embauche</title>
    <style>
      /* Écran de chargement : visible avant le JavaScript, retiré par src/Loader.jsx. */
      html,body{background:#F8FAFC;margin:0}
      #rp-loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#F8FAFC;transition:opacity .6s cubic-bezier(.45,0,.55,1);animation:rpl-gone .3s ease 10s forwards}
      #rp-loader.rpl-out{opacity:0;pointer-events:none}
      #rp-loader svg{width:88px;height:auto;overflow:visible}
      .rpl-l{animation:rpl-l .5s cubic-bezier(.2,.7,.3,1) both}
      .rpl-r{animation:rpl-r .5s cubic-bezier(.2,.7,.3,1) both}
      .rpl-d{animation:rpl-d 1s ease-in-out .45s infinite both}
      .rpl-d2{animation-delay:.6s}.rpl-d3{animation-delay:.75s}
      @keyframes rpl-l{from{opacity:0;transform:translate(-22px,10px)}to{opacity:1;transform:none}}
      @keyframes rpl-r{from{opacity:0;transform:translate(22px,-10px)}to{opacity:1;transform:none}}
      @keyframes rpl-d{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-5px)}}
      @keyframes rpl-gone{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion: reduce){
        #rp-loader{transition:none}
        .rpl-l,.rpl-r,.rpl-d{animation:none}
      }
    </style>
    <noscript><style>#rp-loader{display:none}</style></noscript>
  </head>
  <body>
    <div id="rp-loader" role="status" aria-label="Chargement de La Répét'">
      <svg viewBox="0 0 204 172" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="rpl-gl" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4A7BFB" /><stop offset="1" stop-color="#3B48E9" /></linearGradient>
          <linearGradient id="rpl-gr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4549E8" /><stop offset="1" stop-color="#A064FB" /></linearGradient>
        </defs>
        <g class="rpl-r"><path fill="url(#rpl-gr)" d="M88 16H150A50 50 0 0 1 200 66V86A50 50 0 0 1 150 136H122V122H134A30 30 0 0 0 134 62H88Z" /></g>
        <g class="rpl-l"><path fill="url(#rpl-gl)" d="M88 44H54A50 50 0 0 0 38 141.4L40 166L67 144H112A6 6 0 0 0 118 138V122H82A30 30 0 0 1 82 62H88Z" /></g>
        <circle class="rpl-d" cx="88" cy="92" r="6.5" fill="#0B1A40" />
        <circle class="rpl-d rpl-d2" cx="108" cy="92" r="6.5" fill="#0B1A40" />
        <circle class="rpl-d rpl-d3" cx="128" cy="92" r="6.5" fill="#0B1A40" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
